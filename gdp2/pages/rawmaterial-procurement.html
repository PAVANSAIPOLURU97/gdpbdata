<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pavan's Golden Dairy Products — Raw Material Procurement</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
<link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <img id="appLogo" alt="">
    <div>
      <div class="app-topbar-title">Raw Material Procurement</div>
      <div class="app-topbar-user" id="userLabel"></div>
    </div>
  </div>
  <button class="logout-button" id="logoutBtn" type="button">
    <img id="logoutIcon" alt="">Log Out
  </button>
</header>

<main class="master-form-page">
  <div class="master-columns">

    <section class="form-panel">
      <h2>Add Procurement Entry</h2>
      <form id="procurementForm" autocomplete="off">

        <div class="form-group">
          <label for="entryDateTime">Date &amp; Time of Procurement</label>
          <input type="datetime-local" id="entryDateTime" required>
        </div>

        <div class="form-group">
          <label for="rawMaterialName">Raw Material</label>
          <select id="rawMaterialName" required></select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" inputmode="decimal" step="0.01" min="0.01" placeholder="e.g. 50" required>
        </div>

        <div class="form-group">
          <label for="unit">Unit</label>
          <select id="unit" required></select>
        </div>

        <div class="form-group">
          <label for="supplier">Procured From (Shop Name)</label>
          <input type="text" id="supplier" placeholder="e.g. Sharma Traders" required>
        </div>

        <div class="form-group">
          <label for="rate">Rate (per unit)</label>
          <input type="number" id="rate" inputmode="decimal" step="0.01" min="0" placeholder="e.g. 42" required>
        </div>

        <div class="form-group">
          <label for="amount">Amount (auto-calculated)</label>
          <input type="number" id="amount" readonly tabindex="-1">
        </div>

        <button type="button" class="secondary-button" id="refreshOptionsBtn">&#8635; Refresh Raw Materials / Units</button>
        <button type="submit" class="primary-button" id="submitBtn">Save Entry</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </section>

    <section class="list-panel">
      <h2>Procurement Entries</h2>
      <div id="listArea"></div>
      <div id="totalArea"></div>
    </section>

  </div>

  <a class="back-button" href="../dashboard.html">&larr; Back to Dashboard</a>
</main>

<script>const BASE_PATH = "../";</script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/users-data.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/master/master-common.js"></script>
<script src="../assets/js/rawmaterial-procurement.js"></script>
</body>
</html>
