<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master — Pavan's Golden Dairy Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/dashboard.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <img id="appLogo" alt="">
    <div class="app-topbar-title">Master</div>
  </div>
  <button class="logout-button" id="logoutBtn" type="button">
    <img id="logoutIcon" alt="">Log Out
  </button>
</header>

<main>
  <div class="tile-grid">
    <button class="tile tile-units" type="button" onclick="window.location.href='master/units.html'">
      <div class="tile-icon-frame"><img id="unitsIcon" alt=""></div>
      <span>Units</span>
    </button>

    <button class="tile tile-milkMaster" type="button" onclick="window.location.href='master/milk-master.html'">
      <div class="tile-icon-frame"><img id="milkMasterIcon" alt=""></div>
      <span>Milk Master</span>
    </button>

    <button class="tile tile-rawMaterials" type="button" onclick="window.location.href='master/rawmaterials.html'">
      <div class="tile-icon-frame"><img id="rawMaterialsIcon" alt=""></div>
      <span>Raw Materials</span>
    </button>

    <button class="tile tile-productMaster" type="button" onclick="window.location.href='master/product-master.html'">
      <div class="tile-icon-frame"><img id="productMasterIcon" alt=""></div>
      <span>Product Master</span>
    </button>

    <button class="tile tile-employeeMaster" type="button" onclick="window.location.href='master/employee-master.html'">
      <div class="tile-icon-frame"><img id="employeeMasterIcon" alt=""></div>
      <span>Employee Master</span>
    </button>
  </div>

  <div style="text-align:center; padding: 0 var(--space-md) var(--space-md);">
    <a class="back-button" href="../dashboard.html">&#8592; Back to Home</a>
  </div>
</main>

<script>const BASE_PATH = "../";</script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/users-data.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
  const session = requireLogin("master");
  if (session) {
    setImage(document.getElementById("appLogo"), "appLogo");
    setImage(document.getElementById("logoutIcon"), "logoutIcon");
    setImage(document.getElementById("unitsIcon"), "unitsIcon");
    setImage(document.getElementById("milkMasterIcon"), "milkMasterIcon");
    setImage(document.getElementById("rawMaterialsIcon"), "rawMaterialsIcon");
    setImage(document.getElementById("productMasterIcon"), "productMasterIcon");
    setImage(document.getElementById("employeeMasterIcon"), "employeeMasterIcon");
  }
  document.getElementById("logoutBtn").addEventListener("click", logout);
</script>
</body>
</html>
