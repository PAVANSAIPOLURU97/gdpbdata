<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Master — Pavan's Golden Dairy Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/dashboard.css">
<link rel="stylesheet" href="../../assets/css/forms.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <img id="appLogo" alt="">
    <div class="app-topbar-title">Employee Master</div>
  </div>
  <button class="logout-button" id="logoutBtn" type="button">
    <img id="logoutIcon" alt="">Log Out
  </button>
</header>

<main class="master-form-page">
  <div class="master-columns">

    <section class="form-panel">
      <h2>Add an Employee</h2>
      <form id="employeeForm">
        <div class="form-group">
          <label for="employeeName">Employee Name</label>
          <input type="text" id="employeeName" placeholder="e.g. Ravi Kumar" required>
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <input type="text" id="role" placeholder="e.g. Packing Staff, Driver, Helper" required>
        </div>
        <div class="form-group">
          <label for="salary">Salary</label>
          <input type="number" id="salary" step="0.01" min="0" placeholder="e.g. 12000" required>
        </div>
        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="tel" id="phoneNumber" placeholder="e.g. 9876543210" required>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" placeholder="House no, street, village/town" required></textarea>
        </div>
        <div class="form-group">
          <label for="emergencyContact">Emergency Contact Number</label>
          <input type="tel" id="emergencyContact" placeholder="e.g. 9876500000" required>
        </div>
        <button type="submit" class="primary-button" id="submitBtn">Add Employee</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </section>

    <section class="list-panel">
      <h2>Employees</h2>
      <div id="listArea"><p class="list-loading">Loading...</p></div>
    </section>

  </div>

  <div style="text-align:center;">
    <a class="back-button" href="../master.html">&#8592; Back to Master</a>
  </div>
</main>

<script>const BASE_PATH = "../../";</script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/users-data.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/master/master-common.js"></script>
<script src="../../assets/js/master/employee-master.js"></script>
</body>
</html>
