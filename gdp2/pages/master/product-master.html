<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Master — Pavan's Golden Dairy Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/dashboard.css">
<link rel="stylesheet" href="../../assets/css/forms.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <img id="appLogo" alt="">
    <div class="app-topbar-title">Product Master</div>
  </div>
  <button class="logout-button" id="logoutBtn" type="button">
    <img id="logoutIcon" alt="">Log Out
  </button>
</header>

<main class="master-form-page">
  <div class="master-columns">

    <section class="form-panel">
      <h2>Add a Product</h2>
      <form id="productForm">
        <div class="form-group">
          <label for="productName">Product Name</label>
          <input type="text" id="productName" placeholder="e.g. Paneer, Ghee, Curd" required>
        </div>
        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="number" id="quantity" step="0.01" min="0" placeholder="e.g. 1" required>
        </div>
        <div class="form-group">
          <label for="unit">Unit</label>
          <select id="unit" required></select>
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input type="number" id="price" step="0.01" min="0" placeholder="e.g. 350.00" required>
        </div>
        <div class="form-group">
          <label for="statusAvailability">Available?</label>
          <select id="statusAvailability" required>
            <option value="">Select</option>
            <option value="Yes">Yes</option>
            <option value="No">No</option>
          </select>
        </div>
        <button type="submit" class="primary-button" id="submitBtn">Add Product</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </section>

    <section class="list-panel">
      <h2>Products</h2>
      <div id="listArea"><p class="list-loading">Loading...</p></div>
    </section>

  </div>

  <div style="text-align:center;">
    <a class="back-button" href="../master.html">&#8592; Back to Master</a>
  </div>
</main>

<script>const BASE_PATH = "../../";</script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/users-data.js"></script>
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/master/master-common.js"></script>
<script src="../../assets/js/master/product-master.js"></script>
</body>
</html>
